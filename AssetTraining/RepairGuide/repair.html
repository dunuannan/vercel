<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学设备维修指南</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
        }

        .sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar-header h1 {
            font-size: 15px;
            font-weight: 700;
            color: #f1f5f9;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .sidebar-header p {
            font-size: 11px;
            color: #64748b;
            margin: 6px 0 0;
        }

        .nav-list {
            flex: 1;
            padding: 12px 10px;
            overflow-y: auto;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 12px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            margin: 3px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            transition: all 0.2s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        .nav-item.active {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.2);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 12px 10px 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .home-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .home-link:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }

        .main-content {
            margin-left: 240px;
            height: 100vh;
            background: #f8fafc;
        }

        .main-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>维修指南</h1>
            <p>教学设备维修维护</p>
        </div>

        <div class="nav-list">
            <div class="nav-label">内容导航</div>

            <div class="nav-item" data-page="RepairSystem.html" onclick="switchPage(this)">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                教学设备维修制度
            </div>

            <div class="nav-item active" data-page="ProjectorAnalysis.html" onclick="switchPage(this)">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                    <path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h4"/>
                </svg>
                投影设备现状分析
            </div>
        </div>

        <div class="sidebar-footer">
            <a href="../index.html" class="home-link" onclick="window.top.location.href='../index.html'; return false;">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                    </svg>
                返回首页
            </a>
        </div>
    </nav>

    <div class="main-content">
        <iframe id="contentFrame" src="ProjectorAnalysis.html"></iframe>
    </div>

    <script>
        function switchPage(el) {
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.classList.remove('active');
            });
            el.classList.add('active');

            var frame = document.getElementById('contentFrame');
            frame.src = el.getAttribute('data-page');
        }

        function hideHomeBtn() {
            try {
                var doc = document.getElementById('contentFrame').contentDocument;
                if (!doc) return;
                var btn = doc.querySelector('.home-btn');
                if (btn) btn.style.display = 'none';
            } catch(e) {}
        }

        var frame = document.getElementById('contentFrame');
        frame.addEventListener('load', hideHomeBtn);
        // 确保初始加载也执行
        setTimeout(hideHomeBtn, 500);
    </script>

</body>
</html>
