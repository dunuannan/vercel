<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#172033;--muted:#64748b;--border:#dbe3ef;--primary:#1d4ed8;--red:#dc2626;--orange:#d97706;--yellow:#ca8a04;--green:#047857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
header{background:#12305f;color:#fff;padding:18px 28px}h1{font-size:22px;margin:0 0 6px}.sub{font-size:12px;opacity:.9;line-height:1.7}
main{max-width:1440px;margin:0 auto;padding:20px 24px}footer{padding:16px 24px;color:var(--muted);text-align:center;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--border);padding:10px 28px}
.btn{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}.panel h2{font-size:16px;margin:0 0 12px}
.hint{background:#eff6ff;border-left:3px solid #2563eb;color:#1e3a8a;padding:12px 14px;border-radius:5px;line-height:1.8;margin-bottom:14px}.muted{color:var(--muted)}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px;background:#fafafa}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:7px;padding:13px 14px;background:#fff}.kpi strong{display:block;font-size:22px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.warn{border-left:4px solid var(--yellow)}.warn.orange{border-left-color:var(--orange)}.warn.red{border-left-color:var(--red)}.level{display:inline-block;border-radius:999px;padding:2px 8px;color:#fff;font-size:12px}.level.yellow{background:var(--yellow)}.level.orange{background:var(--orange)}.level.red{background:var(--red)}.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}.tag.info{background:#dbeafe;color:#1e40af}.tag.warn{background:#fef3c7;color:#92400e}.tag.muted{background:#f1f5f9;color:#475569}.link{border:0;background:transparent;color:#1e40af;text-decoration:underline;cursor:pointer;font:inherit;padding:0;margin:0 4px 0 0}.link:hover{color:#1d4ed8}
table{width:100%;border-collapse:collapse;background:#fff}th,td{border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#334155;font-weight:700;white-space:nowrap}td.num{text-align:right;white-space:nowrap}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}
.detail-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.filter-field{display:flex;flex-direction:column;gap:5px}.filter-field label{font-size:12px;color:var(--muted)}.filter-field input,.filter-field select{height:34px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);padding:0 9px;font:inherit;min-width:0}.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px}.result-count{font-size:12px;color:var(--muted)}
.dept-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.dept-link{display:block;background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:12px;text-decoration:none;color:var(--ink)}.dept-link:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(29,78,216,.12)}.dept-link.yellow{border-left-color:var(--yellow);background:#fffbeb}.dept-link.orange{border-left-color:var(--orange);background:#fff7ed}.dept-link.red{border-left-color:var(--red);background:#fef2f2}.quarter-badge{display:inline-block;margin-top:7px;border-radius:999px;padding:3px 9px;color:#fff;font-size:12px}.quarter-badge.yellow{background:var(--yellow)}.quarter-badge.orange{background:var(--orange)}.quarter-badge.red{background:var(--red)}.bad-link{color:#991b1b;background:#fef2f2}
.drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.18);display:none;z-index:50}.drawer-backdrop.open{display:block}.drawer{position:fixed;right:-620px;top:0;width:min(600px,92vw);height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(15,23,42,.16);z-index:60;transition:right .24s ease;overflow:auto;padding:20px}.drawer.open{right:0}.drawer .close{position:absolute;top:12px;right:14px;border:0;background:transparent;font-size:24px;color:#64748b;cursor:pointer}.drawer h3{margin:0 38px 14px 0}.meta{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px 12px;line-height:1.9;margin-bottom:12px}.meta b{display:inline-block;min-width:86px;color:#334155}
input[type=file]{display:none}@media(max-width:720px){header,.toolbar{padding-left:16px;padding-right:16px}main{padding:16px}th,td{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>天津海运职业学院—纪委办公室 · 采购提示</h1>
<div class="sub">依据国有资产管理处采购提示规则：同品项按规格、型号相同的同品种商品识别，不按商品分类合并。</div>
</header>
<div class="toolbar"><div id="topInfo" class="muted">正在加载数据...</div><div><a class="btn" href="index.html">部门列表</a> <button class="btn primary" onclick="document.getElementById('localDataFile').click()">选择 JSON</button></div></div>
<input id="localDataFile" type="file" accept=".json,application/json">
<main id="app"><div class="panel">正在加载部门采购提示...</div></main>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
<button class="close" type="button" onclick="closeDrawer()">&times;</button>
<h3 id="drawerTitle">详情</h3>
<div id="drawerBody"></div>
</aside>
<footer>页面自动读取 ../goods_data_full.json；直接双击打开时若浏览器阻止读取，请使用“选择 JSON”。</footer>
<script>window.WORK_TIPS_CONFIG = {"mode": "department", "department": "天津海运职业学院—纪委办公室"};</script>
<script>
const $=id=>document.getElementById(id);
const EXCLUDED=new Set(["已取消","已退货"]);
function txt(v){return (v??"").toString().trim();}
function num(v){if(typeof v==="number")return v;const raw=txt(v).replace(/,/g,"").replace(/￥/g,"").replace(/元/g,"");const n=Number(raw);return Number.isFinite(n)?n:0;}
function money(v){return num(v).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function datePart(v){const s=txt(v);return s.length>=10?s.slice(0,10):s;}
function qKey(day){if(day.length<7)return "";const m=Number(day.slice(5,7));return Number.isFinite(m)?`${day.slice(0,4)}-Q${Math.floor((m-1)/3)+1}`:"";}
function mToQ(month){return qKey(`${month}-01`);}
function fnum(v){const n=num(v);return Number.isInteger(n)?String(n):String(Number(n.toFixed(2)));}
function normKey(v){return txt(v).replace(/\s+/g," ");}
function itemKey(r){const code=txt(r["商品货号"]);return code || [normKey(r["品牌"]),normKey(r["商品名称"]),fnum(r["单价(元)"])].join("|");}
function normRow(r,i){const day=datePart(r["下单时间"]);const code=txt(r["商品货号"]);return {idx:i,order:txt(r["订单编号"]),status:txt(r["订单状态"]),datetime:txt(r["下单时间"]),date:day,year:day.slice(0,4),month:day.slice(0,7),quarter:qKey(day),department:txt(r["采购单位用户"])||txt(r["采购单位"])||"未填写采购单位",org:txt(r["采购单位"])||"天津海运职业学院",account:txt(r["下单人账号"]),contract:txt(r["合同编号"]),plan:txt(r["采购计划编号"]),order_amount:num(r["订单总额(元)"]),phone:txt(r["联系电话"]),address:txt(r["收货地址"]),delivery:txt(r["要求送达时间"]),supplier:txt(r["供应商"]),buyer:txt(r["采购人"]),category:txt(r["商品分类"]),brand:txt(r["品牌"]),name:txt(r["商品名称"]),item_code:code,item_key:itemKey(r),qty:num(r["采购数量"]),unit_price:num(r["单价(元)"]),subtotal:num(r["小计金额(元)"]),image:txt(r["商品图片链接"])};}
function esc(s){return txt(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function statusTag(status){const cls=EXCLUDED.has(status)?"warn":"info";return `<span class="tag ${cls}">${esc(status||"未填写")}</span>`;}
function orderLink(order){const value=esc(order);return value?`<button type="button" class="link order-link" data-order="${value}" onclick="showOrder(this.dataset.order)">${value}</button>`:"";}
function orderLinks(orders){return (orders||[]).filter(Boolean).map(orderLink).join(" ");}
function orderLinesTable(lines){const sorted=[...lines].sort((a,b)=>(a.datetime+a.idx).localeCompare(b.datetime+b.idx));const body=sorted.map(r=>`<tr><td>${esc(r.datetime)}</td><td>${statusTag(r.status)}</td><td>${esc(r.category)}</td><td>${esc(r.name)}</td><td>${esc(r.item_code)}</td><td>${esc(r.brand)}</td><td class="num">${money(r.unit_price)}</td><td class="num">${esc(r.qty)}</td><td class="num">${money(r.subtotal)}</td><td>${esc(r.supplier)}</td><td>${esc(r.buyer)}</td></tr>`).join("");return `<div class="table-wrap"><table><thead><tr><th>下单时间</th><th>状态</th><th>商品分类</th><th>商品名称</th><th>货号</th><th>品牌</th><th>单价</th><th>数量</th><th>小计</th><th>供应商</th><th>采购人</th></tr></thead><tbody>${body}</tbody></table></div>`;}
function showOrder(orderId){const lines=pageRows.filter(r=>r.order===orderId);if(!lines.length)return;const sorted=[...lines].sort((a,b)=>(a.datetime+a.idx).localeCompare(b.datetime+b.idx));const first=sorted[0];const amount=first.order_amount||lines.reduce((sum,r)=>sum+r.subtotal,0);openDrawer(`订单 ${esc(orderId)}`,`<div class="meta"><b>采购单位</b>${esc(first.org||first.department)}<br><b>需求部门</b>${esc(first.department)}<br><b>状态</b>${statusTag(first.status)}<br><b>下单时间</b>${esc(first.datetime)}<br><b>金额</b>${money(amount)}<br><b>供应商</b>${esc(first.supplier)}<br><b>采购人</b>${esc(first.buyer)}<br><b>联系电话</b>${esc(first.phone)||'<span class="tag muted">未填写</span>'}<br><b>合同编号</b>${esc(first.contract)||'<span class="tag warn">缺失</span>'}<br><b>计划编号</b>${esc(first.plan)||'<span class="tag warn">缺失</span>'}<br><b>要求送达</b>${esc(first.delivery)||'<span class="tag muted">未填写</span>'}<br><b>收货地址</b>${esc(first.address)}</div>${orderLinesTable(lines)}`);}
function openDrawer(title,body){$("drawerTitle").innerHTML=title;$("drawerBody").innerHTML=body;$("drawer").classList.add("open");$("drawerBackdrop").classList.add("open");}
function closeDrawer(){$("drawer").classList.remove("open");$("drawerBackdrop").classList.remove("open");}
function levelLabel(l){return l==="red"?"红色":l==="orange"?"橙色":"黄色";}
function annualLevel(a){return a>=50000?"red":a>=45000?"orange":"yellow";}
function monthlyLevel(c){return c>2?"red":"orange";}
function groupBy(rows,keyFn){const m=new Map();rows.forEach(r=>{const k=keyFn(r);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(r);});return m;}
function warning(rows,period,type,level){const sorted=[...rows].sort((a,b)=>(a.date+a.order+a.idx).localeCompare(b.date+b.order+b.idx));const first=sorted[0];const orders=[...new Set(rows.map(r=>r.order).filter(Boolean))].sort();return {type,period,level,item_key:first.item_key,item_code:first.item_code,item_name:first.name,brand:first.brand,category:first.category,order_count:orders.length,total_amount:rows.reduce((s,r)=>s+r.subtotal,0),orders,first_date:sorted[0]?.date||"",last_date:sorted[sorted.length-1]?.date||""};}
function ranking(rows,period){const sorted=[...rows].sort((a,b)=>(a.date+a.order+a.idx).localeCompare(b.date+b.order+b.idx));const first=sorted[0];const orders=[...new Set(rows.map(r=>r.order).filter(Boolean))].sort();return {period,item_key:first.item_key,item_code:first.item_code,item_name:first.name,brand:first.brand,category:first.category,order_count:orders.length,total_amount:rows.reduce((s,r)=>s+r.subtotal,0),last_date:sorted[sorted.length-1]?.date||""};}
function rankingScope(active,currentYear){const current=active.filter(r=>r.year===currentYear);return current.length?{scope:"current_year",period:currentYear,rows:current}:{scope:"history",period:"历史有效数据",rows:active};}
function annualRanking(active,currentYear){const scoped=rankingScope(active,currentYear);const items=[...groupBy(scoped.rows,r=>r.item_key).values()].map(g=>ranking(g,scoped.period));items.sort((a,b)=>b.total_amount-a.total_amount||b.order_count-a.order_count||a.item_key.localeCompare(b.item_key));return {scope:scoped.scope,period:scoped.period,items:items.slice(0,10)};}
function monthlyRanking(active,currentYear){const scoped=rankingScope(active,currentYear);const items=[...groupBy(scoped.rows,r=>r.month?`${r.month}\u0001${r.item_key}`:"").entries()].map(([k,g])=>ranking(g,k.split("\u0001")[0]));items.sort((a,b)=>b.order_count-a.order_count||b.total_amount-a.total_amount||a.period.localeCompare(b.period)||a.item_key.localeCompare(b.item_key));return {scope:scoped.scope,period:scoped.period,items:items.slice(0,10)};}
function buildDept(rows,department,currentYear,currentQuarter){const all=rows.filter(r=>r.department===department);const active=all.filter(r=>!EXCLUDED.has(r.status));const annual=[];for(const [k,g] of groupBy(active,r=>r.year?`${r.year}\u0001${r.item_key}`:"")){const [year]=k.split("\u0001");const total=g.reduce((s,r)=>s+r.subtotal,0);if(year===currentYear&&total>=40000)annual.push(warning(g,year,"annual",annualLevel(total)));}annual.sort((a,b)=>(a.level!=="red")-(b.level!=="red")||b.total_amount-a.total_amount);const monthly=[];for(const [k,g] of groupBy(active,r=>r.month?`${r.month}\u0001${r.item_key}`:"")){const [month]=k.split("\u0001");const count=new Set(g.map(r=>r.order).filter(Boolean)).size;if(month.startsWith(currentYear)&&count>=2)monthly.push(warning(g,month,"monthly",monthlyLevel(count)));}monthly.sort((a,b)=>(a.level!=="red")-(b.level!=="red")||b.order_count-a.order_count||b.total_amount-a.total_amount);const focus=[...annual.filter(w=>active.some(r=>r.item_key===w.item_key&&r.quarter===currentQuarter)).map(w=>({...w,focus_reason:"当前年度同品项金额预警"})),...monthly.filter(w=>mToQ(w.period)===currentQuarter).map(w=>({...w,focus_reason:"当前季度同品项月度频次预警"}))];const details=[...active].sort((a,b)=>(b.date+b.order+b.idx).localeCompare(a.date+a.order+a.idx));return {all,active,summary:{active_rows:active.length,excluded_rows:all.length-active.length,active_orders:new Set(active.map(r=>r.order).filter(Boolean)).size,total_amount:active.reduce((s,r)=>s+r.subtotal,0)},annual_warnings:annual,monthly_warnings:monthly,annual_rankings:annualRanking(active,currentYear),monthly_frequency_rankings:monthlyRanking(active,currentYear),current_quarter_focus:focus,details};}
function kpis(items){return `<div class="kpis">${items.map(i=>`<div class="kpi"><span>${esc(i.label)}</span><strong>${esc(i.value)}</strong></div>`).join("")}</div>`;}
function warnCards(items,empty){if(!items.length)return `<div class="empty">${empty}</div>`;return `<div class="grid">${items.map(w=>`<div class="panel warn ${w.level}"><h2>${esc(w.item_name||w.item_key)}</h2><p><span class="level ${w.level}">${levelLabel(w.level)}</span> ${esc(w.period)} · ${w.type==="annual"?"年度金额":"月度频次"}</p><p>金额：<b>${money(w.total_amount)}</b> 元；订单数：<b>${w.order_count}</b></p><p class="muted">货号：${esc(w.item_code||"无货号，按品牌+名称+单价识别")}；订单：${orderLinks(w.orders)}</p></div>`).join("")}</div>`;}
function rankingTable(data,title){if(!data.items.length)return `<div class="empty">暂无可用于排行的有效同品项数据。</div>`;const note=data.scope==="history"?"当前年度无有效同品项数据，以下为历史有效数据排行。":`以下为 ${esc(data.period)} 有效数据排行。`;return `<p class="desc">${esc(title)} · ${note}</p><div class="table-wrap"><table><thead><tr><th>排名</th><th>商品名称</th><th>货号/识别方式</th><th>品牌</th><th>统计期间</th><th>订单数</th><th>金额</th><th>最近采购</th></tr></thead><tbody>${data.items.map((r,i)=>`<tr><td class="num">${i+1}</td><td>${esc(r.item_name)}</td><td>${esc(r.item_code||"无货号，按品牌+名称+单价识别")}</td><td>${esc(r.brand)}</td><td>${esc(r.period)}</td><td class="num">${r.order_count}</td><td class="num">${money(r.total_amount)}</td><td>${esc(r.last_date)}</td></tr>`).join("")}</tbody></table></div>`;}
function warnOrRanking(warnings,ranking,title,empty){return warnings.length?warnCards(warnings,empty):rankingTable(ranking,title);}
let detailRows=[];
let pageRows=[];
function uniqueOptions(rows,key){return [...new Set(rows.map(r=>txt(r[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-CN"));}
function optionTags(values){return `<option value="">全部</option>${values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}`;}
function detailControls(rows,visibleCount){return `<div class="detail-filter-grid"><div class="filter-field"><label for="detailKeyword">关键词</label><input id="detailKeyword" type="search" placeholder="订单/商品/供应商" oninput="applyDetailFilters()"></div><div class="filter-field"><label for="detailDateStart">开始日期</label><input id="detailDateStart" type="date" onchange="applyDetailFilters()"></div><div class="filter-field"><label for="detailDateEnd">结束日期</label><input id="detailDateEnd" type="date" onchange="applyDetailFilters()"></div><div class="filter-field"><label for="detailSupplier">供应商</label><select id="detailSupplier" onchange="applyDetailFilters()">${optionTags(uniqueOptions(rows,"supplier"))}</select></div><div class="filter-field"><label for="detailBuyer">采购人</label><select id="detailBuyer" onchange="applyDetailFilters()">${optionTags(uniqueOptions(rows,"buyer"))}</select></div><div class="filter-field"><label for="detailBrand">品牌</label><select id="detailBrand" onchange="applyDetailFilters()">${optionTags(uniqueOptions(rows,"brand"))}</select></div><div class="filter-field"><label for="detailCategory">商品分类</label><select id="detailCategory" onchange="applyDetailFilters()">${optionTags(uniqueOptions(rows,"category"))}</select></div><div class="filter-field"><label for="detailSku">货号</label><input id="detailSku" type="search" placeholder="输入货号" oninput="applyDetailFilters()"></div><div class="filter-field"><label for="detailAmountMin">最小金额</label><input id="detailAmountMin" type="number" min="0" step="0.01" oninput="applyDetailFilters()"></div><div class="filter-field"><label for="detailAmountMax">最大金额</label><input id="detailAmountMax" type="number" min="0" step="0.01" oninput="applyDetailFilters()"></div><div class="filter-field"><label for="detailSort">排序</label><select id="detailSort" onchange="applyDetailFilters()"><option value="datetime">下单时间</option><option value="subtotal">小计金额</option><option value="name">商品名称</option><option value="supplier">供应商</option></select></div><div class="filter-field"><label for="detailSortDir">方向</label><select id="detailSortDir" onchange="applyDetailFilters()"><option value="desc">降序</option><option value="asc">升序</option></select></div><div class="filter-field"><label for="detailLimit">每页条数</label><select id="detailLimit" onchange="applyDetailFilters()"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option><option value="all">全部</option></select></div></div><div class="detail-actions"><div id="detailResultCount" class="result-count">共 ${rows.length} 条，当前显示 ${visibleCount} 条</div><button class="btn" type="button" onclick="resetDetailFilters()">重置筛选</button></div>`;}
function detailState(){return {keyword:txt($("detailKeyword")?.value).toLowerCase(),dateStart:txt($("detailDateStart")?.value),dateEnd:txt($("detailDateEnd")?.value),supplier:txt($("detailSupplier")?.value),buyer:txt($("detailBuyer")?.value),brand:txt($("detailBrand")?.value),category:txt($("detailCategory")?.value),sku:txt($("detailSku")?.value).toLowerCase(),amountMin:txt($("detailAmountMin")?.value),amountMax:txt($("detailAmountMax")?.value),sort:txt($("detailSort")?.value)||"datetime",dir:txt($("detailSortDir")?.value)||"desc",limit:txt($("detailLimit")?.value)||"50"};}
function matchesDetail(row,state){if(state.keyword){const hay=[row.order,row.datetime,row.name,row.item_code,row.brand,row.supplier,row.buyer,row.category].join(" ").toLowerCase();if(!hay.includes(state.keyword))return false;}if(state.dateStart&&row.date<state.dateStart)return false;if(state.dateEnd&&row.date>state.dateEnd)return false;if(state.supplier&&row.supplier!==state.supplier)return false;if(state.buyer&&row.buyer!==state.buyer)return false;if(state.brand&&row.brand!==state.brand)return false;if(state.category&&row.category!==state.category)return false;if(state.sku&&!row.item_code.toLowerCase().includes(state.sku))return false;if(state.amountMin&&row.subtotal<Number(state.amountMin))return false;if(state.amountMax&&row.subtotal>Number(state.amountMax))return false;return true;}
function sortDetails(rows,state){const factor=state.dir==="asc"?1:-1;return [...rows].sort((a,b)=>{let av=a[state.sort]??"",bv=b[state.sort]??"";if(state.sort==="datetime"){av=a.datetime||a.date;bv=b.datetime||b.date;}if(state.sort==="subtotal")return (av-bv)*factor;return txt(av).localeCompare(txt(bv),"zh-CN")*factor;});}
function renderDetailRows(rows){return rows.map(r=>`<tr><td>${orderLink(r.order)}</td><td>${esc(r.datetime)}</td><td>${esc(r.name)}</td><td>${esc(r.item_code)}</td><td>${esc(r.brand)}</td><td class="num">${money(r.unit_price)}</td><td class="num">${esc(r.qty)}</td><td class="num">${money(r.subtotal)}</td><td>${esc(r.supplier)}</td><td>${esc(r.buyer)}</td></tr>`).join("");}
function applyDetailFilters(){const body=$("detailRowsBody");if(!body)return;const state=detailState();const filtered=sortDetails(detailRows.filter(row=>matchesDetail(row,state)),state);const limit=state.limit==="all"?filtered.length:Number(state.limit||50);const visible=filtered.slice(0,limit);body.innerHTML=visible.length?renderDetailRows(visible):`<tr><td colspan="10" class="empty">没有符合筛选条件的明细。</td></tr>`;const count=$("detailResultCount");if(count)count.textContent=`共 ${filtered.length} 条，当前显示 ${visible.length} 条`;}
function resetDetailFilters(){["detailKeyword","detailDateStart","detailDateEnd","detailSupplier","detailBuyer","detailBrand","detailCategory","detailSku","detailAmountMin","detailAmountMax"].forEach(id=>{const el=$(id);if(el)el.value="";});const sort=$("detailSort");if(sort)sort.value="datetime";const dir=$("detailSortDir");if(dir)dir.value="desc";const limit=$("detailLimit");if(limit)limit.value="50";applyDetailFilters();}
function detailsTable(rows){detailRows=rows;if(!rows.length)return `<div class="empty">暂无有效订单明细</div>`;const initial=sortDetails(rows,{sort:"datetime",dir:"desc",limit:"50"}).slice(0,50);return `${detailControls(rows,initial.length)}<div class="table-wrap"><table><thead><tr><th>订单编号</th><th>下单时间</th><th>商品名称</th><th>货号</th><th>品牌</th><th>单价</th><th>数量</th><th>小计</th><th>供应商</th><th>采购人</th></tr></thead><tbody id="detailRowsBody">${renderDetailRows(initial)}</tbody></table></div>`;}
function renderDepartment(rows){const cfg=window.WORK_TIPS_CONFIG;const normalized=rows.map(normRow);pageRows=normalized.filter(r=>r.department===cfg.department);const activeAll=normalized.filter(r=>!EXCLUDED.has(r.status));const dates=activeAll.map(r=>r.date).filter(Boolean).sort();const latest=dates[dates.length-1]||"";const currentYear=latest.slice(0,4);const currentQuarter=qKey(latest);const data=buildDept(normalized,cfg.department,currentYear,currentQuarter);$("topInfo").textContent=`数据期：${dates[0]||"-"} 至 ${latest||"-"}；当前口径：${currentYear||"-"} / ${currentQuarter||"-"}`; $("app").innerHTML=`<div class="hint">提示只基于本地订单明细进行统计。若相关货物或服务在天津市政府采购中心平台有售，应通过该平台采购；本页不判定平台是否有售，也不直接认定违规。</div>${kpis([{label:"有效明细",value:data.summary.active_rows},{label:"排除取消/退货",value:data.summary.excluded_rows},{label:"有效订单",value:data.summary.active_orders},{label:"有效金额(元)",value:money(data.summary.total_amount)}])}<section class="panel"><h2>当前季度重点提示</h2>${warnCards(data.current_quarter_focus,"当前季度暂无金额或频次提示。")}</section><section class="panel"><h2>年度累计金额提示</h2>${warnOrRanking(data.annual_warnings,data.annual_rankings,"同品项金额排行 TOP 10","当前年度暂无同品项金额接近或达到 5 万元红线。")}</section><section class="panel"><h2>月度采购频次提示</h2>${warnOrRanking(data.monthly_warnings,data.monthly_frequency_rankings,"同品项月度频次排行 TOP 10","当前年度暂无同品项单月采购达到 2 次或超过 2 次。")}</section><section class="panel"><h2>有效订单商品明细</h2>${detailsTable(data.details)}</section>`;}
function quarterFocusSummary(items){const rank={red:3,orange:2,yellow:1};if(!items.length)return {count:0,level:"",className:"",label:""};const level=items.reduce((best,item)=>(rank[item.level]||0)>(rank[best]||0)?item.level:best,"yellow");return {count:items.length,level,className:level,label:`季度重点：${levelLabel(level)} ${items.length} 项`};}
function renderIndex(rows){const cfg=window.WORK_TIPS_CONFIG;const normalized=rows.map(normRow);const active=normalized.filter(r=>!EXCLUDED.has(r.status));const departments=[...new Set(normalized.map(r=>r.department))].sort();const dates=active.map(r=>r.date).filter(Boolean).sort();const latest=dates[dates.length-1]||"";const currentYear=latest.slice(0,4);const currentQuarter=qKey(latest);$("topInfo").textContent=`已读取 ${rows.length} 行，部门 ${departments.length} 个`;const list=departments.map(d=>{const file=cfg.departmentFiles[d];const data=buildDept(normalized,d,currentYear,currentQuarter);const focus=quarterFocusSummary(data.current_quarter_focus);if(file)return `<a class="dept-link ${focus.className}" href="${encodeURI(file)}"><b>${esc(d)}</b><br><span class="muted">打开部门提示页</span>${focus.count?`<br><span class="quarter-badge ${focus.className}">${esc(focus.label)}</span>`:""}</a>`;return `<div class="dept-link bad-link"><b>${esc(d)}</b><br><span>新部门尚未生成页面，请重新运行 build_work_tips.py。</span></div>`;}).join("");$("app").innerHTML=`${kpis([{label:"原始明细",value:rows.length},{label:"有效明细",value:active.length},{label:"排除取消/退货",value:normalized.length-active.length},{label:"数据期",value:`${dates[0]||"-"} 至 ${dates[dates.length-1]||"-"}`}])}<section class="panel"><h2>部门提示页</h2><div class="dept-list">${list}</div></section>`;}
async function loadAuto(){try{const res=await fetch('../goods_data_full.json?ts='+Date.now(),{cache:"no-store"});if(!res.ok)throw new Error(`HTTP ${res.status}`);const rows=await res.json();loadRows(rows);}catch(e){$("topInfo").textContent="自动读取失败，可手动选择 goods_data_full.json";$("app").innerHTML=`<div class="panel"><h2>无法自动读取数据</h2><p class="muted">如果当前是双击 file:// 打开，这是浏览器安全限制导致的正常现象。部署到本地 HTTP 服务后会自动读取，或点击右上角选择 JSON。</p><p class="muted">${esc(e.message)}</p></div>`;}}
function loadRows(rows){if(!Array.isArray(rows))throw new Error("JSON 须为数组");if(window.WORK_TIPS_CONFIG.mode==="index")renderIndex(rows);else renderDepartment(rows);}
$("localDataFile").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{loadRows(JSON.parse(reader.result));}catch(err){$("topInfo").textContent="JSON 解析失败";$("app").innerHTML=`<div class="panel">${esc(err.message)}</div>`;}};reader.readAsText(file,"utf-8");});
loadAuto();
</script>
</body>
</html>
