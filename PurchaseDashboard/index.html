*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}.hero{background:linear-gradient(120deg,#0f172a 0%,#1e3a8a 52%,#1e40af 100%);color:#fff;padding:18px 28px}.hero-title{font-size:21px;font-weight:700;letter-spacing:.5px}.hero-sub{margin-top:5px;font-size:12px;opacity:.9}.top-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 28px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}.info{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:0;overflow:auto;background:#fff;border-bottom:1px solid var(--border);padding:0 28px}.tab{border:0;background:transparent;padding:14px 21px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;font:inherit}.tab:hover{color:var(--primary)}.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}.load-state{max-width:1600px;margin:0 auto;padding:16px 28px}.load-state:empty{display:none}.load-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,.05);line-height:1.8}.load-card.error{border-left-color:var(--warn);background:#fffbeb;color:#78350f}.load-card button{height:32px;border:0;border-radius:5px;background:var(--primary);color:#fff;padding:0 12px;margin-left:8px;cursor:pointer}main{max-width:1600px;margin:0 auto;padding:20px 28px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.05)}.panel h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}.panel h2:before{content:"";display:inline-block;width:4px;height:17px;background:var(--primary);border-radius:2px}.desc{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 12px}.info-box{background:#eff6ff;border-left:3px solid var(--accent);padding:12px 14px;border-radius:4px;color:#1e3a8a;line-height:1.8;margin-bottom:14px}.danger-box{background:#fef2f2;border-left:3px solid var(--danger);padding:12px 14px;border-radius:4px;color:#7f1d1d;line-height:1.8;margin-bottom:14px}.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.kpi{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:7px;padding:15px 17px;cursor:default}.kpi.clickable-card{cursor:pointer}.kpi.clickable-card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,64,175,.12)}.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.danger{border-left-color:var(--danger)}.kpi .label{font-size:12px;color:var(--muted);margin-bottom:7px}.kpi .value{font-size:26px;font-weight:800;color:#0f172a}.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row.three{grid-template-columns:1fr 1fr 1fr}.table-wrap{border:1px solid var(--border);border-radius:6px;overflow:auto;max-height:560px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}th{position:sticky;top:0;background:#f3f4f6;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-weight:700;color:#374151;z-index:1}td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}tr:hover td{background:#f8fafc}th.sortable{cursor:pointer}th.sortable:after{content:" ↕";font-size:10px;color:#94a3b8}.text-right{text-align:right}.nowrap{white-space:nowrap}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{height:32px;border:1px solid var(--border);border-radius:5px;background:#fff;padding:0 9px;min-width:130px}.toolbar input[type=number]{min-width:110px}.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}.tag.high,.tag.danger{background:#fee2e2;color:#991b1b}.tag.mid,.tag.warn{background:#fef3c7;color:#92400e}.tag.low,.tag.ok{background:#dcfce7;color:#166534}.tag.info{background:#dbeafe;color:#1e40af}.tag.muted{background:#f1f5f9;color:#475569}.link{color:#1e40af;text-decoration:underline;cursor:pointer}.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12px}.bar-row .name{flex:0 0 230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-row .track{flex:1;background:#f1f5f9;height:18px;border-radius:4px;overflow:hidden}.bar-row .fill{height:100%;min-width:32px;background:linear-gradient(90deg,#1e40af,#0ea5e9);color:#fff;font-size:11px;line-height:18px;padding-left:6px}.bar-row .fill.ok{background:linear-gradient(90deg,#059669,#10b981)}.bar-row .fill.warn{background:linear-gradient(90deg,#d97706,#f59e0b)}.bar-row .fill.danger{background:linear-gradient(90deg,#dc2626,#ef4444)}.bar-row .num{flex:0 0 92px;text-align:right}.heat-table td{min-width:86px}.heat-cell{display:block;border-radius:4px;padding:4px 6px;text-align:right;color:#0f172a;background:#eff6ff}.empty{padding:28px;text-align:center;color:var(--muted)}.drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.18);display:none;z-index:50}.drawer-backdrop.open{display:block}.drawer{position:fixed;right:-620px;top:0;width:min(600px,92vw);height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(15,23,42,.16);z-index:60;transition:right .24s ease;overflow:auto;padding:20px}.drawer.open{right:0}.drawer .close{position:absolute;top:12px;right:14px;border:0;background:transparent;font-size:24px;color:#64748b;cursor:pointer}.drawer h3{margin:0 38px 14px 0}.meta{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px 12px;line-height:1.9;margin-bottom:12px}.meta b{display:inline-block;min-width:86px;color:#334155}footer{border-top:1px solid var(--border);padding:22px 28px;text-align:center;color:var(--muted);font-size:12px;margin-top:24px}@media(max-width:1100px){.row,.row.three{grid-template-columns:1fr}.bar-row .name{flex-basis:170px}main{padding:14px}.tabs{padding:0 14px}.top-bar,.hero{padding-left:16px;padding-right:16px}.load-state{padding:14px}}@media(max-width:720px){.hero-title{font-size:18px}.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.bar-row{display:block}.bar-row .name,.bar-row .num{display:block;text-align:left;margin:4px 0}.toolbar input,.toolbar select{min-width:100%;width:100%}.load-card button{display:block;margin:10px 0 0}}

<body>
<header class="hero">
  <div class="hero-title">📊 采购风险分析驾驶舱 · 天津海运职业学院</div>
  <div class="hero-sub">基于《天津海运职业学院采购工作管理办法（2026.6.15修订）》风险红线 · 数据源：同目录 goods_data_full.json，双击打开时可手动选择本地 JSON/CSV</div>

<div class="top-bar">
  <div id="topInfo" class="info"></div>

<script>

let D = null;
const VIEWS = [
  ["overview","🏠 总览"],["split","⚠️ 化整为零风险"],["over5w","💰 5万红线突破"],["contract","📋 合规性核查"],
  ["price","💲 同品价差异常"],["supplier","🏭 供应商风险"],["trend","📈 趋势分析"],["drill","🔍 明细钻取"]
];
const tableStates = {};
let currentView = "overview";
const $ = (id)=>document.getElementById(id);
const esc = (v)=>String(v ?? "").replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
const fmtMoney = (n)=>"¥"+Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtWan = (n)=>"¥"+(Number(n||0)/10000).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})+"万";
const pct = (n)=>`${(Number(n||0)*100).toFixed(1)}%`;
const levelTag = (v)=>`<span class="tag ${v==="高"?"high":v==="中"?"mid":"low"}">${esc(v)}</span>`;
const statusTag = (v)=>{const s=String(v||"");let cls=s.includes("退")||s.includes("取消")?"danger":s.includes("发货")?"ok":"info";return `<span class="tag ${cls}">${esc(s)}</span>`};
function setLoadState(html, error=false){$("loadState").innerHTML = html ? `<div class="load-card ${error?"error":""}">${html}</div>` : "";}
function showLoading(text){$("topInfo").textContent=text; setLoadState(`${esc(text)}`);}
function showLoadError(text){$("topInfo").textContent="等待选择本地数据文件"; setLoadState(`${esc(text)} <button onclick="$('localDataFile').click()">选择 goods_data_full.json/csv</button>`, true);}
async function bootstrapDashboard(){
  showLoading("正在读取同目录 goods_data_full.json ...");
  try{
    const response = await fetch('./goods_data_full.json?ts=' + Date.now(), {cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const rows = await response.json();
    loadRows(rows, "goods_data_full.json");
  }catch(err){
    showLoadError("未能自动读取同目录 goods_data_full.json。若当前是双击 file:// 打开，这是浏览器安全限制导致的正常现象；部署到 Web 服务器后会自动读取同目录 JSON。");
  }
}
function loadLocalDataFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const text = String(reader.result || "");
      const rows = file.name.toLowerCase().endsWith(".csv") ? parseCsv(text) : JSON.parse(text);
      loadRows(rows, file.name);
    }catch(err){
      showLoadError(`文件解析失败：${err.message || err}`);
    }
  };
  reader.onerror = () => showLoadError("文件读取失败，请确认文件可访问。");
  reader.readAsText(file, "utf-8");
}
function loadRows(rows, sourceName){
  if(rows && !Array.isArray(rows) && rows.detail && rows.summary){D=rows;}
  else{
    if(!Array.isArray(rows)) throw new Error("数据文件必须是 JSON 数组或 CSV 表格");
    D = buildDashboardPayload(rows, sourceName);
  }
  currentView = "overview";
  Object.keys(tableStates).forEach(key=>delete tableStates[key]);
  setLoadState("");
  setTopInfo(); initTabs(); renderCurrent();
}
function parseCsv(text){
  const cells=[]; let row=[]; let cell=""; let quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(quoted){
      if(ch === '"' && next === '"'){cell += '"'; i++;}
      else if(ch === '"'){quoted=false;}
      else cell += ch;
    }else if(ch === '"') quoted=true;
    else if(ch === ","){row.push(cell); cell="";}
    else if(ch === "\n"){row.push(cell); cells.push(row); row=[]; cell="";}
    else if(ch !== "\r") cell += ch;
  }
  row.push(cell); cells.push(row);
  while(cells.length && cells[cells.length-1].every(v=>!String(v).trim())) cells.pop();
  if(!cells.length) return [];
  const headers = cells[0].map(h=>String(h||"").replace(/^\uFEFF/,"").trim());
  return cells.slice(1).map(values=>{
    const obj={};
    headers.forEach((header,index)=>{if(header)obj[header]=values[index] ?? "";});
    return obj;
  });
}
function txt(value){return String(value ?? "").trim();}
function num(value){
  if(value === null || value === undefined) return 0;
  if(typeof value === "number" && Number.isFinite(value)) return value;
  const raw = String(value).replace(/,/g,"").replace(/￥/g,"").replace(/元/g,"").trim();
  const parsed = Number(raw);
  return Number.isFinite(parsed) ? parsed : 0;
}
function round2(value){return Math.round((Number(value)||0)*100)/100;}
function datePart(value){const raw=txt(value); return raw.length>=10 ? raw.slice(0,10) : raw;}
function parseDay(value){const raw=datePart(value); if(!raw) return null; const t=Date.parse(raw+"T00:00:00"); return Number.isFinite(t) ? new Date(t) : null;}
function dayText(date){return date.toISOString().slice(0,10);}
function normalizeRow(row,index){
  const order = txt(row["订单编号"]);
  const rawDate = txt(row["下单时间"]);
  const day = datePart(rawDate);
  return {
    idx:index,
    order,
    status:txt(row["订单状态"]) || "未知",
    datetime:rawDate,
    date:day,
    year:day.length>=4 ? day.slice(0,4) : "",
    month:day.length>=7 ? day.slice(0,7) : "",
    unit:txt(row["采购单位用户"]) || txt(row["采购单位"]) || "未填写采购单位",
    org:txt(row["采购单位"]) || "天津海运职业学院",
    supplier:txt(row["供应商"]) || "未填写供应商",
    buyer:txt(row["采购人"]),
    account:txt(row["下单人账号"]),
    contract:txt(row["合同编号"]),
    plan:txt(row["采购计划编号"]),
    order_amount:round2(num(row["订单总额(元)"])),
    category:txt(row["商品分类"]) || "未分类",
    brand:txt(row["品牌"]) || "未填写品牌",
    name:txt(row["商品名称"]) || "未填写商品名称",
    spec:txt(row["商品货号"]),
    qty:num(row["采购数量"]),
    unit_price:num(row["单价(元)"]),
    subtotal:num(row["小计金额(元)"]),
    image:txt(row["商品图片链接"]),
    phone:txt(row["联系电话"]),
    address:txt(row["收货地址"]),
    delivery:txt(row["要求送达时间"])
  };
}
function invalidDetailReasons(row){
  const reasons=[];
  if(row.subtotal < 0 || row.order_amount < 0) reasons.push("金额为负数");
  if(row.subtotal > Math.max(row.order_amount * 2, 1000000)) reasons.push("明细金额异常");
  if(["0","FALSE","False","false"].includes(row.unit) && ["FALSE","False","false"].includes(row.supplier)) reasons.push("疑似字段错位");
  if(row.subtotal > 0 && (row.qty <= 0 || row.unit_price <= 0)) reasons.push("数量或单价非数字");
  return reasons;
}
function buildDataQualityReport(normalized, detail){
  const issuesByOrder = new Map();
  normalized.forEach(row=>{
    const reasons=invalidDetailReasons(row);
    if(!reasons.length) return;
    const order=row.order || `ROW-${row.idx}`;
    if(!issuesByOrder.has(order)) issuesByOrder.set(order,{order,row_count:0,reasons:[]});
    const issue=issuesByOrder.get(order);
    issue.row_count += 1;
    reasons.forEach(reason=>{if(!issue.reasons.includes(reason)) issue.reasons.push(reason);});
  });
  const issues=[...issuesByOrder.values()].sort((a,b)=>(b.row_count-a.row_count)||a.order.localeCompare(b.order,"zh-CN"));
  return {raw_rows:normalized.length, valid_rows:detail.length, invalid_rows:normalized.length-detail.length, issues};
}
function buildUniqueOrders(detail){
  const map = new Map();
  detail.forEach(row=>{
    const orderId = row.order || `ROW-${row.idx}`;
    if(!map.has(orderId)){
      map.set(orderId,{order:orderId,status:row.status,date:row.date,datetime:row.datetime,unit:row.unit,supplier:row.supplier,buyer:row.buyer,contract:row.contract,plan:row.plan,amount:row.order_amount,phone:row.phone,address:row.address,delivery:row.delivery,line_count:0});
    }
    const order=map.get(orderId);
    order.line_count += 1;
    if(row.order_amount > order.amount) order.amount = row.order_amount;
  });
  return [...map.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date)) || String(b.order).localeCompare(String(a.order)));
}
function amountBy(detail,key,limit){
  const totals = new Map();
  detail.forEach(row=>totals.set(row[key], (totals.get(row[key])||0) + row.subtotal));
  return [...totals.entries()].sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([name,amount])=>({name,amount:round2(amount)}));
}
function riskLevel(amount=0,count=0,ratio=0){
  if(amount>=100000 || count>=8 || ratio>=0.4) return "高";
  if(amount>=70000 || count>=5 || ratio>=0.2) return "中";
  return "低";
}
function groupBy(rows, keyFn){
  const map=new Map();
  rows.forEach(row=>{const key=keyFn(row); if(!key)return; if(!map.has(key))map.set(key,[]); map.get(key).push(row);});
  return map;
}
function uniqSorted(values){return [...new Set(values.filter(Boolean))].sort();}
function buildYearRisks(detail){
  const risks=[];
  groupBy(detail, r=>r.year ? `${r.unit}\u0001${r.category}\u0001${r.year}` : "").forEach((rows,key)=>{
    const [unit,category,year]=key.split("\u0001");
    const total=rows.reduce((sum,row)=>sum+row.subtotal,0);
    if(total < 50000) return;
    const orders=uniqSorted(rows.map(r=>r.order));
    const months={};
    rows.forEach(r=>{if(r.month)months[r.month]=(months[r.month]||0)+1;});
    let running=0, cross_date="";
    [...rows].sort((a,b)=>String(a.date).localeCompare(String(b.date)) || String(a.order).localeCompare(String(b.order)) || a.idx-b.idx).some(row=>{running += row.subtotal; if(running>=50000){cross_date=row.date; return true;} return false;});
    const maxMonth=Object.entries(months).sort((a,b)=>b[1]-a[1])[0] || ["",0];
    risks.push({unit,category,year,order_count:orders.length,total_amount:round2(total),overshoot:round2(total-50000),cross_date,max_month:maxMonth[0],max_month_count:maxMonth[1],orders,level:riskLevel(total,orders.length)});
  });
  return risks.sort((a,b)=>b.total_amount-a.total_amount);
}
function buildMonthFrequency(detail){
  const risks=[];
  groupBy(detail, r=>r.month ? `${r.unit}\u0001${r.category}\u0001${r.month}` : "").forEach((rows,key)=>{
    const [unit,category,month]=key.split("\u0001");
    const orders=uniqSorted(rows.map(r=>r.order));
    if(orders.length < 3) return;
    const amount=rows.reduce((sum,row)=>sum+row.subtotal,0);
    risks.push({unit,category,month,order_count:orders.length,total_amount:round2(amount),orders,level:riskLevel(amount,orders.length)});
  });
  return risks.sort((a,b)=>(b.order_count-a.order_count)||(b.total_amount-a.total_amount));
}
function buildWindow7(detail){
  const orderByGroup = new Map();
  detail.forEach(row=>{
    const day=parseDay(row.date); if(!day || !row.order) return;
    const key=`${row.unit}\u0001${row.category}`;
    if(!orderByGroup.has(key)) orderByGroup.set(key,new Map());
    const orderMap=orderByGroup.get(key);
    if(!orderMap.has(row.order)) orderMap.set(row.order,{date:row.date,day,amount:0});
    orderMap.get(row.order).amount += row.subtotal;
  });
  const risks=[];
  orderByGroup.forEach((orderMap,key)=>{
    const [unit,category]=key.split("\u0001");
    const orders=[...orderMap.entries()].sort((a,b)=>a[1].day-b[1].day);
    for(let startIndex=0; startIndex<orders.length; startIndex++){
      const [orderId,start]=orders[startIndex];
      const endDay=new Date(start.day.getTime()+6*86400000);
      const window=orders.slice(startIndex).filter(([,data])=>data.day<=endDay);
      if(window.length < 3) continue;
      const amount=window.reduce((sum,[,data])=>sum+data.amount,0);
      risks.push({unit,category,start:start.date,end:dayText(endDay),order_count:window.length,total_amount:round2(amount),orders:window.map(([oid])=>oid),level:riskLevel(amount,window.length)});
      break;
    }
  });
  return risks.sort((a,b)=>(b.order_count-a.order_count)||(b.total_amount-a.total_amount));
}
function buildPriceRisks(detail){
  const risks=[];
  groupBy(detail.filter(r=>r.unit_price>0), r=>`${r.category}\u0001${r.brand}\u0001${r.name}`).forEach((rows,key)=>{
    const [category,brand,name]=key.split("\u0001");
    const prices=rows.map(r=>r.unit_price).filter(v=>v>0);
    if(prices.length < 2) return;
    const low=Math.min(...prices), high=Math.max(...prices);
    if(low<=0 || high/low<3) return;
    const multiple=high/low;
    risks.push({category,brand,name,min_price:round2(low),max_price:round2(high),multiple:round2(multiple),record_count:rows.length,orders:uniqSorted(rows.map(r=>r.order)),level:riskLevel(0,0,Math.min(multiple/10,1))});
  });
  return risks.sort((a,b)=>b.multiple-a.multiple);
}
function buildSupplierRisks(detail,orders){
  const ordersBySupplier=groupBy(orders,r=>r.supplier);
  const suppliers=[];
  ordersBySupplier.forEach((supplierOrders,supplier)=>{
    const supplierLines=detail.filter(r=>r.supplier===supplier);
    const totalOrders=supplierOrders.length;
    const returned=supplierOrders.filter(o=>o.status.includes("退")).length;

    const badRatio=totalOrders ? (returned+canceled)/totalOrders : 0;
    suppliers.push({supplier,order_count:totalOrders,return_count:returned,return_rate:totalOrders?round2(returned/totalOrders*100)/100:0,cancel_count:canceled,cancel_rate:totalOrders?round2(canceled/totalOrders*100)/100:0,amount:round2(amount),line_count:supplierLines.length,category_count:new Set(supplierLines.map(r=>r.category)).size,level:riskLevel(amount,totalOrders,badRatio)});
  });
  return suppliers.sort((a,b)=>((b.return_rate+b.cancel_rate)-(a.return_rate+a.cancel_rate)) || (b.amount-a.amount));
}
function buildCompliance(orders){
  const missing_contract_orders=orders.filter(o=>!o.contract);
  const missing_plan_orders=orders.filter(o=>!o.plan);
  const missing_both_orders=orders.filter(o=>!o.contract && !o.plan);
  const grouped=new Map();
  orders.forEach(order=>{
    if(!grouped.has(order.unit)) grouped.set(order.unit,{unit:order.unit,orders:0,no_contract:0,no_plan:0,both:0});
    const row=grouped.get(order.unit);
    row.orders += 1; row.no_contract += order.contract?0:1; row.no_plan += order.plan?0:1; row.both += (!order.contract && !order.plan)?1:0;
  });
  const unit_rank=[...grouped.values()].map(row=>({...row,missing_rate:row.orders?round2((row.no_contract+row.no_plan)/(row.orders*2)*10000)/10000:0})).sort((a,b)=>(b.missing_rate-a.missing_rate)||(b.orders-a.orders));
  return {missing_contract_orders,missing_plan_orders,missing_both_orders,unit_rank};
}
function buildTrends(detail){
  const monthTotals=new Map(), unitMonth=new Map(), categoryMonth=new Map();
  detail.forEach(row=>{
    if(!row.month) return;
    monthTotals.set(row.month,(monthTotals.get(row.month)||0)+row.subtotal);
    if(!unitMonth.has(row.unit)) unitMonth.set(row.unit,new Map());
    unitMonth.get(row.unit).set(row.month,(unitMonth.get(row.unit).get(row.month)||0)+row.subtotal);
    if(!categoryMonth.has(row.category)) categoryMonth.set(row.category,new Map());
    categoryMonth.get(row.category).set(row.month,(categoryMonth.get(row.category).get(row.month)||0)+row.subtotal);
  });
  const topUnits=amountBy(detail,"unit",15).map(x=>x.name);
  const topCategories=amountBy(detail,"category",8).map(x=>x.name);
  return {
    month_amounts:[...monthTotals.entries()].sort().map(([month,amount])=>({month,amount:round2(amount)})),
    unit_month:topUnits.map(unit=>{const months=Object.fromEntries([...(unitMonth.get(unit)||new Map()).entries()].sort().map(([m,a])=>[m,round2(a)])); return {unit,months,total:round2(Object.values(months).reduce((a,b)=>a+b,0))};}),
    category_month:topCategories.map(category=>{const months=Object.fromEntries([...(categoryMonth.get(category)||new Map()).entries()].sort().map(([m,a])=>[m,round2(a)])); return {category,months,total:round2(Object.values(months).reduce((a,b)=>a+b,0))};})
  };
}

function renderHeat(){const months=[...new Set(D.trend.month_amounts.map(x=>x.month))]; const rows=D.trend.unit_month; const max=Math.max(...rows.flatMap(r=>months.map(m=>r.months[m]||0)),1); const head=`<th>单位 \\ 月份</th>${months.map(m=>`<th>${m}</th>`).join("")}<th>合计</th>`; const body=rows.map(r=>`<tr><td title="${esc(r.unit)}">${esc(r.unit)}</td>${months.map(m=>{const v=r.months[m]||0; const a=.12+v/max*.72; return `<td><span class="heat-cell" style="background:rgba(14,165,233,${a.toFixed(2)})">${v?fmtWan(v):""}</span></td>`}).join("")}<td class="text-right">${fmtWan(r.total)}</td></tr>`).join(""); $("heatTable").innerHTML=`<div class="table-wrap"><table class="heat-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;}
function renderDrill(){ $("app").innerHTML=panel("订单明细钻取与全文检索", `<div class="toolbar"><input id="drillQ" placeholder="订单号/商品名/供应商/采购人/品牌" oninput="applyDrill()"><select id="drillStatus" onchange="applyDrill()"><option value="">全部状态</option>${D.filters.statuses.map(s=>`<option>${esc(s)}</option>`).join("")}</select><select id="drillYear" onchange="applyDrill()"><option value="">全部年份</option>${D.filters.years.map(y=>`<option>${y}</option>`).join("")}</select><select id="drillUnit" onchange="applyDrill()"><option value="">全部单位</option>${D.filters.units.map(u=>`<option>${esc(u)}</option>`).join("")}</select><select id="drillCat" onchange="applyDrill()"><option value="">全部类目</option>${D.filters.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</select><span id="drillCount" class="info"></span></div><div id="drillTable"></div>`); applyDrill();}
function applyDrill(){const q=$("drillQ").value.trim().toLowerCase(), st=$("drillStatus").value, yr=$("drillYear").value, un=$("drillUnit").value, ca=$("drillCat").value; const rows=D.detail.filter(r=>(!st||r.status===st)&&(!yr||r.year===yr)&&(!un||r.unit===un)&&(!ca||r.category===ca)&&(!q||`${r.order} ${r.name} ${r.supplier} ${r.unit} ${r.brand} ${r.buyer}`.toLowerCase().includes(q))); $("drillCount").textContent=`共 ${rows.length.toLocaleString()} 条 / ${D.detail.length.toLocaleString()} 条`; renderTable("drillTable","drill",detailColumns(),rows);}
function orderColumns(){return [{key:"order",label:"订单编号",render:r=>orderLink(r.order)},{key:"unit",label:"采购单位"},{key:"date",label:"日期",nowrap:true},{key:"status",label:"状态",render:r=>statusTag(r.status)},{key:"amount",label:"金额",type:"number",align:"right",render:r=>fmtMoney(r.amount)},{key:"contract",label:"合同编号",render:r=>esc(r.contract)||'<span class="tag warn">缺失</span>'},{key:"plan",label:"采购计划编号",render:r=>esc(r.plan)||'<span class="tag warn">缺失</span>'},{key:"supplier",label:"供应商"}];}
function detailColumns(){return [{key:"order",label:"订单号",render:r=>orderLink(r.order)},{key:"status",label:"状态",render:r=>statusTag(r.status)},{key:"date",label:"日期",nowrap:true},{key:"unit",label:"单位"},{key:"category",label:"类目",render:r=>`<span class="tag muted">${esc(r.category)}</span>`},{key:"name",label:"商品"},{key:"brand",label:"品牌"},{key:"unit_price",label:"单价",type:"number",align:"right",render:r=>fmtMoney(r.unit_price)},{key:"qty",label:"数量",type:"number",align:"right"},{key:"subtotal",label:"小计",type:"number",align:"right",render:r=>fmtMoney(r.subtotal)},{key:"supplier",label:"供应商"}];}
function showOrder(orderId){const order=D.orders.find(o=>o.order===orderId), lines=D.detail.filter(r=>r.order===orderId); if(!order)return; openDrawer(`订单 ${esc(orderId)}`, `<div class="meta"><b>采购单位</b>${esc(order.unit)}<br><b>状态</b>${statusTag(order.status)}<br><b>金额</b>${fmtMoney(order.amount)}<br><b>供应商</b>${esc(order.supplier)}<br><b>合同编号</b>${esc(order.contract)||'<span class="tag warn">缺失</span>'}<br><b>计划编号</b>${esc(order.plan)||'<span class="tag warn">缺失</span>'}<br><b>收货地址</b>${esc(order.address)}</div><div id="drawerTable"></div>`); renderTable("drawerTable","drawerOrder",detailColumns(),lines,200);}
function showPrice(category,brand,name){const rows=D.detail.filter(r=>r.category===category&&r.brand===brand&&r.name===name); openDrawer("同品价格明细", `<div class="meta"><b>类目</b>${esc(category)}<br><b>品牌</b>${esc(brand)}<br><b>商品</b>${esc(name)}</div><div id="drawerTable"></div>`); renderTable("drawerTable","drawerPrice",detailColumns(),rows,200);}
function showSupplier(supplier){const rows=D.detail.filter(r=>r.supplier===supplier); openDrawer("供应商详情", `<div class="meta"><b>供应商</b>${esc(supplier)}<br><b>商品行</b>${rows.length.toLocaleString()}<br><b>金额</b>${fmtMoney(rows.reduce((a,b)=>a+b.subtotal,0))}</div><div id="drawerTable"></div>`); renderTable("drawerTable","drawerSupplier",detailColumns(),rows,200);}
function openDrawer(title,body){$("drawerTitle").innerHTML=title; $("drawerBody").innerHTML=body; $("drawer").classList.add("open"); $("drawerBackdrop").classList.add("open");}
function closeDrawer(){$("drawer").classList.remove("open"); $("drawerBackdrop").classList.remove("open");}
bootstrapDashboard();

</script>
</body>
</html>
